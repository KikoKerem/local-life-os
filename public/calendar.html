<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>local-life-os — Calendar</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="brand">local<span class="accent">·</span>life<span class="accent">·</span>os</span>
    <nav class="nav" id="nav"></nav>
  </div>

  <div id="toolbar" class="cal-toolbar"></div>
  <div id="out"></div>
</div>

<script type="module">
import { $, esc, api, toast, modal } from '/ui.js';

const HOUR_H = 48;
let offset = 0;

const monday = (base) => { const d = new Date(base); const k = (d.getDay()+6)%7; d.setHours(0,0,0,0); d.setDate(d.getDate()-k); return d; };
const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const minsOf = (iso) => { const d=new Date(iso); return d.getHours()*60+d.getMinutes(); };
const hourLabel = (h) => h===0?'12 AM':h<12?h+' AM':h===12?'12 PM':(h-12)+' PM';
const tm = (iso) => new Date(iso).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});

function layout(evs){
  evs.sort((a,b)=>a.s-b.s||a.e-b.e);
  let cluster=[], clusterEnd=-1; const out=[];
  const flush=()=>{ const lanes=[]; for(const ev of cluster){ let p=false; for(let i=0;i<lanes.length;i++){ if(lanes[i]<=ev.s){ ev.lane=i; lanes[i]=ev.e; p=true; break; } } if(!p){ ev.lane=lanes.length; lanes.push(ev.e); } } cluster.forEach(ev=>ev.lanes=lanes.length); out.push(...cluster); cluster=[]; };
  for(const ev of evs){ if(cluster.length && ev.s>=clusterEnd){ flush(); clusterEnd=-1; } cluster.push(ev); clusterEnd=Math.max(clusterEnd,ev.e); }
  if(cluster.length) flush();
  return out;
}

async function load(){

  const start = monday(new Date()); start.setDate(start.getDate()+offset*7);
  const end = new Date(start); end.setDate(end.getDate()+7);
  const label = `${start.toLocaleDateString(undefined,{month:'long',day:'numeric'})} – ${new Date(end.getTime()-1).toLocaleDateString(undefined,{day:'numeric',year:'numeric'})}`;
  $('#toolbar').innerHTML = `
    <button class="mini" id="prev">←</button>
    <button class="mini" id="today">Today</button>
    <button class="mini" id="next">→</button>
    <strong style="margin-left:8px;font-size:16px">${esc(label)}</strong>
    <span style="margin-left:auto"></span>
    <button class="primary" id="addev">+ Event</button>`;
  $('#prev').onclick=()=>{offset--;load();}; $('#next').onclick=()=>{offset++;load();}; $('#today').onclick=()=>{offset=0;load();};
  $('#addev').onclick=()=>addEvent();

  let events=[];
  try { events=(await api(`/api/calendar/events?from=${start.toISOString()}&to=${end.toISOString()}`)).events||[]; }
  catch { $('#out').innerHTML='<div class="card">could not load events</div>'; return; }

  const days=[...Array(7)].map((_,i)=>{ const d=new Date(start); d.setDate(d.getDate()+i); return d; });
  const todayStr=isoDay(new Date());
  const byId={}; events.forEach(e=>byId[e.id]=e);

  // header
  const head = days.map(d=>{ const t=isoDay(d)===todayStr;
    return `<div class="dh ${t?'today':''}"><div class="dow">${d.toLocaleDateString(undefined,{weekday:'short'})}</div><div class="dnum">${d.getDate()}</div></div>`; }).join('');
  // all-day row
  const allday = `<div class="adg">all-day</div>` + days.map(d=>{ const ds=isoDay(d);
    const evs=events.filter(e=>e.allDay && (e.start||'').slice(0,10)<=ds && (e.end||e.start||'').slice(0,10)>ds || (e.allDay && (e.start||'').slice(0,10)===ds));
    return `<div class="adc">${evs.map(e=>`<span class="cal-chip" data-ev="${e.id}" title="${esc(e.summary)}">${esc(e.summary)}</span>`).join('')}</div>`; }).join('');
  // gutter
  const gutter = `<div class="cal-gutter">${[...Array(24)].map((_,h)=>`<div class="hr">${h?hourLabel(h):''}</div>`).join('')}</div>`;
  // day columns
  const nowMin = new Date().getHours()*60+new Date().getMinutes();
  const cols = days.map(d=>{ const ds=isoDay(d);
    const timed = events.filter(e=>!e.allDay && e.start && isoDay(new Date(e.start))===ds)
      .map(e=>{ let s=minsOf(e.start), en=e.end?minsOf(e.end):s+60; if(en<=s) en=s+60; en=Math.min(en,1440); return {id:e.id, s, e:en, summary:e.summary}; });
    const laid = layout(timed);
    const blocks = laid.map(ev=>{ const w=100/ev.lanes; const full=byId[ev.id]; const past=new Date(full.end||full.start) < new Date(); const col=full.calendarColor||'#4a9eff';
      return `<div class="cal-ev ${past?'past':''}" data-ev="${ev.id}" style="top:${ev.s/60*HOUR_H}px;height:${Math.max(16,(ev.e-ev.s)/60*HOUR_H-2)}px;left:calc(${ev.lane*w}% + 1px);width:calc(${w}% - 2px);background:${col};border-left-color:${col}" title="${esc(full.calendarName||'')}">
        <div class="ttl">${esc(ev.summary)}</div><div class="tm">${tm(full.start)}</div></div>`; }).join('');
    const now = ds===todayStr ? `<div class="cal-now" style="top:${nowMin/60*HOUR_H}px"></div>` : '';
    return `<div class="cal-col" data-day="${ds}">${blocks}${now}</div>`; }).join('');

  $('#out').innerHTML = `<div class="cal-wrap">
    <div class="cal-head"><div></div>${head}</div>
    <div class="cal-allday">${allday}</div>
    <div class="cal-scroll" id="scroll"><div class="cal-body">${gutter}${cols}</div></div>
  </div>`;
  $('#scroll').scrollTop = 7*HOUR_H;

  // interactions — show detail modal on click
  $('#out').querySelectorAll('[data-ev]').forEach(el=> el.onclick=(e)=>{ e.stopPropagation(); const ev=byId[el.dataset.ev]; if(!ev) return;
    const tm2=(iso)=>iso?new Date(iso).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
    modal(`<h3>${esc(ev.summary)}</h3>
      <p style="margin:4px 0;opacity:.7;font-size:13px">${esc(ev.calendarName||'')}</p>
      <p>${esc(tm2(ev.start))}${ev.end?' → '+esc(tm2(ev.end)):''}</p>
      ${ev.location?`<p>📍 ${esc(ev.location)}</p>`:''}
      <p style="margin-top:12px"><button class="btn ghost" onclick="this.closest('.modal-backdrop').remove()">Close</button></p>`);
  });
  $('#out').querySelectorAll('.cal-col').forEach(col=> col.onclick=(e)=>{ if(e.target.closest('.cal-ev')) return;
    const y=e.offsetY; const mins=Math.round((y/HOUR_H*60)/30)*30; const hh=String(Math.floor(mins/60)).padStart(2,'0'); const mm=String(mins%60).padStart(2,'0');
    addEvent(col.dataset.day, `${hh}:${mm}`); });
}

function eventModal(prefill){
  return new Promise(resolve=>{
    const back=document.createElement('div'); back.className='modal-backdrop';
    back.innerHTML=`<div class="modal"><h3>New event</h3>
      <div class="field"><label>Title</label><input id="m-sum" autofocus></div>
      <div class="field"><label>All-day</label><label style="justify-self:start"><input type="checkbox" id="m-all"> spans full day(s)</label></div>
      <div class="field"><label>Start</label><div style="display:flex;gap:6px"><input id="m-sd" type="date" style="flex:1"><input id="m-st" class="tf" type="time" value="${prefill.time}" style="width:120px"></div></div>
      <div class="field"><label>End</label><div style="display:flex;gap:6px"><input id="m-ed" type="date" style="flex:1"><input id="m-et" class="tf" type="time" value="${prefill.endTime}" style="width:120px"></div></div>
      <div class="field"><label>Location</label><input id="m-loc"></div>
      <div class="field"><label>Notes</label><textarea id="m-note" rows="3"></textarea></div>
      <div class="actions"><button class="btn ghost" id="m-cancel">Cancel</button><button class="btn" id="m-save">Add to Apple Calendar</button></div>
    </div>`;
    document.body.appendChild(back);
    const q=(s)=>back.querySelector(s);
    q('#m-sd').value=prefill.date; q('#m-ed').value=prefill.date;
    q('#m-all').onchange=(e)=>back.querySelectorAll('.tf').forEach(t=>t.style.display=e.target.checked?'none':'');
    q('#m-sd').onchange=()=>{ if(q('#m-ed').value<q('#m-sd').value) q('#m-ed').value=q('#m-sd').value; };
    const close=(v)=>{ back.remove(); resolve(v); };
    back.addEventListener('click',e=>{ if(e.target===back) close(null); });
    q('#m-cancel').onclick=()=>close(null);
    q('#m-save').onclick=()=>{
      const summary=q('#m-sum').value.trim(); if(!summary){ toast('title required','err'); return; }
      close({ summary, allDay:q('#m-all').checked, sd:q('#m-sd').value, st:q('#m-st').value, ed:q('#m-ed').value||q('#m-sd').value, et:q('#m-et').value, location:q('#m-loc').value, description:q('#m-note').value });
    };
    setTimeout(()=>q('#m-sum').focus(),0);
  });
}

async function addEvent(date, startTime){
  const d = date || new Date().toISOString().slice(0,10);
  const t = startTime || '09:00';
  const endT = `${String(Math.min(23,+t.slice(0,2)+1)).padStart(2,'0')}:${t.slice(3)}`;
  const v = await eventModal({ date:d, time:t, endTime:endT });
  if(!v) return;
  let payload;
  if(v.allDay){
    payload = { summary:v.summary, allDay:true, start:v.sd, end:v.ed, location:v.location, description:v.description };
  } else {
    const start = new Date(`${v.sd}T${v.st||'09:00'}:00`).toISOString();
    const end = new Date(`${v.ed}T${v.et||'10:00'}:00`).toISOString();
    payload = { summary:v.summary, start, end, location:v.location, description:v.description };
  }
  const res = await api('/api/calendar/events', payload);
  if(res.error){ toast('failed: '+res.error,'err'); return; }
  toast('added to Google Calendar','ok'); load();
}

load();
</script>
</body>
</html>
